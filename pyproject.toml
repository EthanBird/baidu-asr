[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baidu-asr"
version = "1.0.0"
description = "零第三方依赖、高性能百度输入法长语音与音视频转文字 SDK（支持流式与多线程高并发）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Baidu ASR SDK Authors" }]
# 零第三方 Python 包依赖（仅使用 Python 标准库 + 内置 opus.dll）
dependencies = []

[project.scripts]
baidu-asr = "baidu_asr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baidu_asr = ["_bin/*.dll", "_bin/*.so*", "_bin/*.dylib"]
